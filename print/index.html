    <script>
      // GitHub Pages deep links: the site-level 404.html forwards /…/print/<path> here as ?__p=<path>.
      // Restore the real URL before the router starts. No-op everywhere else.
      (function () {
        var p = new URLSearchParams(location.search).get('__p');
        if (p) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + p);
      })();
    </script>
