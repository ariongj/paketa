<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PrintWorks — Studio 3D</title>
</head>
<body>
<!-- The 3D bag studio. It runs on its own page so the storefront only loads three.js when a visitor opens it;
     src/site/pages/Studio3D.tsx embeds it in an iframe and turns the design into a cart line. -->
<div id="app">
  <div id="stage">
    <div class="vignette"></div>
    <div id="views" role="group" data-t-aria="camera">
      <button data-view="34" class="on">3/4</button>
      <button data-view="front" data-t="v_front"></button>
      <button data-view="side" data-t="v_side"></button>
      <button data-view="top" data-t="v_inside"></button>
    </div>
    <details class="light" id="lightBox">
      <summary data-t="light"></summary>
      <div class="row"><label for="envRot" data-t="light_rot"></label><input type="range" id="envRot" min="0" max="360" value="20"><output id="o-envRot"></output></div>
      <div class="row"><label for="expo" data-t="light_bright"></label><input type="range" id="expo" min="0.5" max="1.8" step="0.05" value="1"><output id="o-expo"></output></div>
    </details>
    <div class="hud"><b id="dimsHud"></b><span data-t="hud"></span></div>
    <div id="tools">
      <button id="spin" data-t-title="rotate" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button id="full" data-t-title="fullscreen"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <aside id="panel">
    <nav class="steps" id="tabs" role="tablist" data-t-aria="steps">
      <button role="tab" data-tab="samples" class="on" aria-selected="true"><i>1</i><span data-t="tab_samples"></span></button>
      <button role="tab" data-tab="bag" aria-selected="false"><i>2</i><span data-t="tab_bag"></span></button>
      <button role="tab" data-tab="design" aria-selected="false"><i>3</i><span data-t="tab_design"></span></button>
    </nav>
    <div class="panes" id="panes">
      <div class="pane" data-pane="samples" role="tabpanel">
        <p class="lead" data-t="samples_lead"></p>
        <div class="samples" id="samples"></div>
        <button class="next" data-go="bag" data-t="next_bag"></button>
      </div>

      <div class="pane" data-pane="bag" role="tabpanel" hidden>
        <section>
          <h2 data-t="paper"></h2>
          <div class="seg" id="paperSeg"></div>
        </section>
        <section>
          <h2 data-t="size"></h2>
          <div class="seg" id="sizeSeg" role="group" data-t-aria="size"></div>
          <p class="moq" id="sizeNote"></p>
        </section>
        <section id="colourSec">
          <h2 data-t="colour"></h2>
          <div class="swatches" id="bagSw"></div>
          <label class="custom"><input type="color" id="customColour" value="#80298f"><span data-t="colour_custom"></span></label>
        </section>
        <section id="finishSec">
          <h2 data-t="finish"></h2>
          <div class="seg" id="finishSeg"></div>
        </section>
        <section id="motifSec">
          <h2 data-t="motif"></h2>
          <div class="seg" id="motifSeg"></div>
          <div class="swatches" id="motifSw" data-t-aria="motif_colour"></div>
        </section>
        <section>
          <h2 data-t="handle"></h2>
          <div class="seg" id="handleSeg"></div>
          <div class="swatches" id="handleSw"></div>
          <div class="seg" id="poseSeg">
            <button data-v="upright" class="on" data-t="pose_up"></button>
            <button data-v="relaxed" data-t="pose_down"></button>
          </div>
        </section>
        <button class="next" data-go="design" data-t="next_design"></button>
      </div>

      <div class="pane" data-pane="design" role="tabpanel" hidden>
        <section id="designSec">
          <div class="seg" id="sideSeg" role="group" data-t-aria="side">
            <button data-v="front" class="on" data-t="front"></button>
            <button data-v="back" data-t="back"></button>
            <button id="copySide" class="ghost"></button>
          </div>
          <div class="editor"><canvas id="editor" tabindex="0" data-t-aria="editor_aria"></canvas></div>
          <div class="seg">
            <button id="addText" data-t="add_text"></button>
            <label class="file"><span data-t="add_logo"></span><input type="file" id="addLogo" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
            <button id="addQr" data-t="add_qr"></button>
          </div>
          <div id="props" class="props" hidden>
            <div class="propsHead"><b id="propsTitle"></b><button id="delItem" class="ghost" data-t="remove"></button></div>
            <textarea id="pText" rows="2" data-t-aria="k_text"></textarea>
            <select id="pStyle" data-t-aria="font"></select>
            <input id="pQr" type="url" placeholder="https://" data-t-aria="qr_link">
            <div class="seg" id="pMethod">
              <button data-v="mono" data-t="m_mono"></button>
              <button data-v="full" data-t="m_full"></button>
            </div>
            <div class="swatches" id="pInk" data-t-aria="ink"></div>
            <div class="row"><label for="pSize" data-t="width"></label><input type="range" id="pSize" min="1" max="50" step="0.1"><output id="o-pSize"></output></div>
            <div class="seg"><button id="pCenter" data-t="centre"></button><button id="pDup" data-t="duplicate"></button></div>
            <p class="note" id="pNote"></p>
          </div>
          <p class="note" id="designNote"></p>
        </section>
      </div>
    </div>
    <footer class="sum">
      <div><b id="sumType"></b><span id="sumDims"></span></div>
      <button id="shot" data-t="save_image"></button>
    </footer>
  </aside>
</div>
<div id="boot" aria-hidden="true"><span></span></div>
<script type="module" src="/src/studio/studio.js"></script>
</body>
</html>
